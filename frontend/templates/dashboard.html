<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农业新闻分析与预警系统</title>
    <link rel="icon" type="image/x-icon" href="/static/logo/logo_32x32.ico">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/chatbot.css">
</head>
<body>
<header class="header">
    <div class="header-brand">
        <img src="/static/logo/logo_48x48.ico" alt="Logo" class="header-logo">
        <h1>农业新闻分析与预警</h1>
    </div>
    <div class="header-controls">
        <div class="date-filter">
            <label>日期筛选：</label>
            <input type="date" id="startDate"><span> — </span><input type="date" id="endDate">
            <button id="btnFilter" class="btn-sm btn-primary">筛选</button>
            <button id="btnReset" class="btn-sm btn-outline">重置</button>
        </div>
        <button id="btnCrawl" class="btn-sm btn-crawl" onclick="startCrawl()">🔄 爬取实时新闻</button>
        <div class="status"><span class="dot"></span><span id="statusText">系统运行中</span></div>
    </div>
</header>
<div class="tab-bar">
    <button class="tab-btn active" data-tab="news">新闻分析</button>
    <button class="tab-btn" data-tab="weather">天气预报</button>
    <button class="tab-btn" data-tab="market">市场动态</button>
    <button class="tab-btn" data-tab="disaster">灾害预警</button>
</div>
<div class="tab-content" id="tabNews">
    <div class="stats-row">
        <div class="stat-card">
            <div class="value" id="stat-news">--</div>
            <div class="label">新闻总数</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-disasters">--</div>
            <div class="label">灾害预警</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-categories">--</div>
            <div class="label">分类数量</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-sentiment-score">--</div>
            <div class="label">舆情得分</div>
        </div>
    </div>
    <div class="charts-row">
        <div class="chart-card"><h3>新闻分类分布</h3>
            <div class="chart-container" id="chartCategory"></div>
        </div>
        <div class="chart-card"><h3>情感分析</h3>
            <div class="chart-container" id="chartSentiment"></div>
        </div>
    </div>
    <div class="charts-row">
        <div class="chart-card"><h3>新闻趋势</h3>
            <div class="chart-container" id="chartTrend"></div>
        </div>
        <div class="chart-card">
            <h3>热点关键词
                <button id="btnKeywords" class="btn-sm" style="float:right">刷新</button>
            </h3>
            <div class="keyword-cloud" id="keywordCloud"></div>
        </div>
    </div>
    <div id="keywordNewsRow" class="charts-row" style="display:none">
        <div class="chart-card chart-card-full">
            <h3>相关新闻 <span id="keywordNewsTitle"></span>
                <button id="btnCloseKeywordNews" class="btn-sm"
                        style="float:right;background:red;color:white;border:none">X 关闭
                </button>
            </h3>
            <div id="keywordNewsList" class="news-list"></div>
        </div>
    </div>
    <div class="charts-row">
        <div class="chart-card chart-card-full"><h3>最新新闻</h3>
            <div id="newsList" class="news-list"></div>
        </div>
    </div>
</div>
<div class="tab-content" id="tabWeather" style="display:none">
    <div class="weather-page">
        <div class="weather-controls">
            <label>省份：</label>
            <select id="weatherProvince">
                <option value="">-- 请选择省份 --</option>
            </select>
            <label>城市：</label>
            <select id="weatherCity">
                <option value="">-- 请先选择省份 --</option>
            </select>
            <button id="btnRefreshWeather" class="btn-sm btn-primary">刷新</button>
        </div>
        <div id="weatherCurrent" class="weather-current"></div>
        <div id="weatherForecast" class="weather-forecast"></div>
    </div>
</div>
<div class="tab-content" id="tabMarket" style="display:none">
    <div class="market-page">
        <div class="market-header" style="display:flex;justify-content:space-between;align-items:center;padding:12px 24px">
            <h3 style="margin:0">农产品批发市场价格</h3>
            <div>
                <label>品类：</label>
                <select id="priceCategory" style="padding:4px 8px;border:1px solid #ccc;border-radius:4px">
                    <option value="粮食">粮食</option>
                    <option value="油料">油料</option>
                    <option value="棉花">棉花</option>
                    <option value="食糖">食糖</option>
                    <option value="蔬菜">蔬菜</option>
                    <option value="水果">水果</option>
                    <option value="畜禽">畜禽</option>
                </select>
                <label style="margin-left:10px">品种：</label>
                <select id="priceCommodity" style="padding:4px 8px;border:1px solid #ccc;border-radius:4px"></select>
                <button id="btnQueryPrice" class="btn-sm btn-primary" style="margin-left:10px">查询</button>
                <button id="btnFetchAllPrices" class="btn-sm btn-crawl" style="margin-left:8px" onclick="fetchAllPrices()" title="从农业农村部批量提取所有22个品种的最新价格">📥 手动提取所有价格</button>
            </div>
        </div>
        <div id="priceResult" style="padding:0 24px 20px">
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px">
                <div class="price-card" style="background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
                    <div style="color:#888;font-size:13px">当前价格</div>
                    <div style="font-size:28px;font-weight:700;color:#2e86c1;margin:6px 0" id="pCurrent">--</div>
                    <div style="font-size:13px" id="pChange">--</div>
                </div>
                <div class="price-card" style="background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
                    <div style="color:#888;font-size:13px">全国均价</div>
                    <div style="font-size:28px;font-weight:700;color:#27ae60;margin:6px 0" id="pAvg">--</div>
                    <div style="font-size:12px;color:#888" id="pUnit">元/公斤</div>
                </div>
                <div class="price-card" style="background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
                    <div style="color:#888;font-size:13px">数据更新</div>
                    <div style="font-size:16px;margin:6px 0" id="pUpdate">--</div>
                    <div style="font-size:12px;color:#888" id="pSource">--</div>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
                <div style="background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
                    <h4 style="margin:0 0 8px;font-size:14px">各省价格</h4>
                    <div id="provincePrices" style="max-height:280px;overflow-y:auto"></div>
                </div>
                <div style="background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
                    <h4 style="margin:0 0 8px;font-size:14px">批发市场价格排行</h4>
                    <div id="wholesaleRanking" style="max-height:280px;overflow-y:auto"></div>
                </div>
            </div>
            <div style="background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08)">
                <h4 style="margin:0 0 8px;font-size:14px">价格趋势（近7天）</h4>
                <div id="priceTrendChart" style="height:280px"></div>
            </div>
        </div>
    </div>
</div>
<div class="tab-content" id="tabDisaster" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0">
        <h2 style="color:red;margin:0">实时灾害预警</h2>
        <button id="btnRefreshDisasters" class="btn-sm btn-primary">刷新</button>
    </div>
    <div class="disaster-grid" id="disasterList" style="padding:12px 24px 24px"></div>
</div>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/chatbot.js"></script>

<!-- Floating AI Assistant -->
<div id="chatbotFAB" class="chatbot-fab" title="AI 助手">💬</div>
<div id="chatbotPanel" class="chatbot-panel">
    <div class="chatbot-panel-header">
        <span>🤖 农业新闻 AI 助手</span>
        <button id="chatbotClose" class="chatbot-close-btn">&times;</button>
    </div>
    <div class="chatbot-panel-body">
        <iframe id="chatbotIframe" frameborder="0" allow="clipboard-write"
                title="AI Chat Assistant" data-gradio-url="http://localhost:7860"></iframe>
    </div>
</div>
</body>
</html>
